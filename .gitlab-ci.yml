image: node:22-alpine

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web"'

.all-events:
  rules: &all_events
    - when: on_success

stages:
  - validate
  - test
  - build
  - integration
  - security

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

unit-tests:
  rules: *all_events
  stage: test
  before_script:
    - npm ci --prefer-offline
  script:
    - npm test -- --watch=false

production-build:
  rules: *all_events
  stage: build
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Console has its own target/auth/proxy. Existing ERP jobs above remain required.
.console-node:
  rules: *all_events
  image: node:22.22.2-bookworm-slim
  before_script:
    - npm ci --prefer-offline

console:validate:
  extends: .console-node
  stage: validate
  script:
    - npm run console:typecheck
    - npm run console:lint
    - sh -n scripts/console-ci-checkout.sh
    - sh -n scripts/console-ci-inner.sh

console:unit:
  extends: .console-node
  stage: test
  script:
    - npm run console:test -- --reporters=junit --output-file=reports/console-unit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/console-unit.xml

console:production-build:
  extends: .console-node
  stage: build
  script:
    - npm run console:build
    - npm run console:bundle-check
  artifacts:
    paths: [dist/xarionix-console/]
    expire_in: 1 week

console:integration:
  rules: *all_events
  # Docker executor only. NEVER send frontend code to runtime-rootless shell Runner.
  tags: [debian]
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - name: docker:29.9.2-dind-rootless@sha256:ae083cc7de51e7a8e5a597f8fb774ca7914c408a95fc0f1477826a913479518a
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  variables:
    FF_NETWORK_PER_BUILD: "1"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
  timeout: 60 minutes
  before_script:
    - apk add --no-cache python3 git
  script:
    - sh scripts/console-ci-checkout.sh
    - python3 -u scripts/console_ci.py --core .console-core
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/console-e2e.xml]
    reports:
      junit: reports/console-e2e.xml

console:dependencies:
  extends: .console-node
  stage: security
  script:
    - npm run console:security
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/console-dependency-audit.json]

console:secrets:
  rules: *all_events
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --no-banner --report-format json --report-path console-gitleaks.json .
  artifacts:
    when: always
    expire_in: 1 week
    paths: [console-gitleaks.json]
