<form class="grid gap-5" data-testid="address-object-form" (ngSubmit)="submit()">
    <hlm-dialog-header class="pr-8">
        <h3 hlmDialogTitle>
            {{ editing() ? 'Изменение адресного объекта' : 'Новый адресный объект' }}
        </h3>
        <p hlmDialogDescription>
            {{ parentName() ? 'Родитель: ' + parentName() : 'Корневой уровень каталога' }}
        </p>
    </hlm-dialog-header>

    <hlm-field-group class="gap-5">
        <hlm-field class="min-w-0">
            <label hlmFieldLabel for="address-object-type">Тип объекта</label>

            <hlm-select
                [value]="typeId()"
                [itemToString]="typeToString"
                (valueChange)="selectType($event)">
                <hlm-select-trigger
                    buttonId="address-object-type"
                    data-testid="address-object-type"
                    class="w-full">
                    <hlm-select-value placeholder="Выберите тип объекта" />
                </hlm-select-trigger>

                <hlm-select-content *hlmSelectPortal>
                    <hlm-select-group>
                        <hlm-select-label>Тип объекта</hlm-select-label>
                        @for (type of types(); track type.id) {
                        <hlm-select-item [value]="type.id">
                            {{ type.name }}
                        </hlm-select-item>
                        }
                    </hlm-select-group>
                </hlm-select-content>
            </hlm-select>
        </hlm-field>

        <hlm-field class="min-w-0">
            <label hlmFieldLabel for="address-object-name">{{ nameLabel() }}</label>
            <input
                hlmInput
                id="address-object-name"
                name="addressObjectName"
                maxlength="255"
                autocomplete="off"
                data-testid="address-object-name"
                [ngModel]="name()"
                (ngModelChange)="nameChange.emit($event)" />
        </hlm-field>
    </hlm-field-group>

    @if (error(); as message) {
    <hlm-alert variant="destructive" data-testid="address-object-error">
        <p hlmAlertDescription>{{ message }}</p>
    </hlm-alert>
    }

    <hlm-dialog-footer>
        <button
            hlmBtn
            variant="outline"
            type="button"
            hlmDialogClose
            data-testid="address-object-cancel"
            [disabled]="saving()">
            Отмена
        </button>
        <button
            hlmBtn
            type="submit"
            data-testid="address-object-submit"
            [disabled]="saving()">
            @if (saving()) {
            <hlm-spinner aria-label="Сохранение адресного объекта" />
            }
            Сохранить
        </button>
    </hlm-dialog-footer>
</form>
